# ==========================================
# Terminal & Environment
# ==========================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g mouse on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -as terminal-features '*:sixel'
set -g allow-passthrough on

# Project / Session Switcher (tmux-sessionizer)
bind-key -r f display-popup -E -w 75% -h 65% "tmux-sessionizer"

# ==========================================
# Key Bindings (Vi Mode & Navigation)
# ==========================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

# Vim-like Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window / Pane Creation (Current Working Directory)
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Configuration Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."
