# proxychains.conf VER 4.x
# Strict dual-hop tunneling with DNS leak mitigation

strict_chain

# Proxy DNS requests remotely to prevent leakage
proxy_dns
remote_dns_subnet 224

# Aggressive connect timeout for rapid failure detection
tcp_read_time_out 15000
tcp_connect_time_out 800

[ProxyList]
# Primary hop: Local SSH Dynamic Port Forward (ssh-socks)
socks5  127.0.0.1 1080

# Secondary hop: Local Tor SOCKS daemon
socks4  127.0.0.1 9050
